<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Run — Anto Soji</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        :root {
            --bg: #FFF8F0;
            --bg-card: #ffffff;
            --text: #222222;
            --text-muted: #666666;
            --text-faint: #999999;
            --border: #dddddd;
            --accent: #E67E22;
            --ground: #535353;
            --ground-fill: #535353;
            --dino: #535353;
            --obstacle: #535353;
            --cloud: #e8e8e8;
            --score-color: #535353;
            --overlay-bg: rgba(255, 248, 240, 0.92);
        }
        :root.dark {
            --bg: #0F0F0F;
            --bg-card: #1A1A1A;
            --text: #E8E8E8;
            --text-muted: #AAAAAA;
            --text-faint: #666666;
            --border: #333333;
            --accent: #E67E22;
            --ground: #E8E8E8;
            --ground-fill: #E8E8E8;
            --dino: #E8E8E8;
            --obstacle: #E8E8E8;
            --cloud: #333333;
            --score-color: #E8E8E8;
            --overlay-bg: rgba(15, 15, 15, 0.92);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 10;
        }
        .top-bar a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .top-bar a:hover { opacity: 0.7; }
        #themeToggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            cursor: pointer;
            transition: border-color 0.25s, transform 0.2s;
            color: var(--text);
        }
        #themeToggle:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .icon-sun, .icon-moon { width: 18px; height: 18px; }
        .icon-sun { display: block; }
        .icon-moon { display: none; }
        :root.dark .icon-sun { display: none; }
        :root.dark .icon-moon { display: block; }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .score-bar {
            display: flex;
            justify-content: space-between;
            width: 600px;
            max-width: 92vw;
            font-size: 14px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .score-bar .hi { color: var(--accent); font-weight: 600; }
        canvas {
            display: block;
            border-radius: 16px;
            cursor: pointer;
            max-width: 92vw;
        }
        .hint {
            font-size: 13px;
            color: var(--text-faint);
            text-align: center;
            line-height: 1.6;
        }
        .hint kbd {
            display: inline-block;
            padding: 2px 7px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--bg-card);
            font-family: inherit;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .score-bar { font-size: 13px; }
            .hint { font-size: 12px; padding: 0 12px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="javascript:history.back()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
    </a>
    <button id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</div>

<div class="game-wrapper">
    <div class="score-bar">
        <span id="scoreDisplay">00000</span>
        <span class="hi" id="hiDisplay">HI 00000</span>
    </div>
    <canvas id="game"></canvas>
    <p class="hint">
        <kbd>Space</kbd> or <kbd>↑</kbd> to jump &nbsp;·&nbsp; <kbd>↓</kbd> to duck &nbsp;·&nbsp; Tap to jump on mobile
    </p>
</div>

<script>
/* =============================================
   THEME TOGGLE
   ============================================= */
const themeToggle = document.getElementById("themeToggle");
themeToggle.onclick = () => {
    const isDark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
};

/* =============================================
   CANVAS SETUP
   ============================================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 600, H = 200;
canvas.width = W;
canvas.height = H;

function getCSS(prop) {
    return getComputedStyle(document.documentElement).getPropertyValue(prop).trim();
}

/* =============================================
   GAME STATE
   ============================================= */
let speed, score, hiScore, frameCount, gameRunning, gameOver;
let dino, obstacles, clouds, groundOffset, groundBumps;
let flashTimer = 0;

hiScore = parseInt(localStorage.getItem("dinoHi")) || 0;
document.getElementById("hiDisplay").textContent = "HI " + String(hiScore).padStart(5, "0");

function resetGame() {
    speed = 6;
    score = 0;
    frameCount = 0;
    gameRunning = false;
    gameOver = false;
    flashTimer = 0;
    groundOffset = 0;

    dino = {
        x: 50,
        y: H - 44,
        w: 44,
        h: 44,
        vy: 0,
        jumping: false,
        ducking: false,
        duckH: 26,
        legFrame: 0,
        legTimer: 0
    };

    obstacles = [];
    clouds = [];

    // Generate ground bumps
    groundBumps = [];
    for (let i = 0; i < 20; i++) {
        groundBumps.push({
            x: i * 40 + Math.random() * 20,
            w: 6 + Math.random() * 14,
            h: 1 + Math.random() * 2
        });
    }

    // Initial clouds
    for (let i = 0; i < 4; i++) {
        clouds.push(makeCloud(Math.random() * W));
    }
}

function makeCloud(startX) {
    return {
        x: startX || W + Math.random() * 100,
        y: 25 + Math.random() * 50,
        w: 36 + Math.random() * 30,
        speed: 0.5 + Math.random() * 0.5
    };
}

resetGame();

/* =============================================
   OBSTACLE SPAWNING
   ============================================= */
let spawnTimer = 0;

function spawnObstacle() {
    const r = Math.random();
    let ob;

    if (r < 0.35) {
        // Small cactus
        const h = 30 + Math.random() * 15;
        ob = { type: "cactus", x: W + 10, y: H - 34 - h, w: 14, h: h + 4, variant: "small" };
    } else if (r < 0.65) {
        // Tall cactus
        const h = 40 + Math.random() * 15;
        ob = { type: "cactus", x: W + 10, y: H - 34 - h, w: 16, h: h + 4, variant: "tall" };
    } else if (r < 0.82) {
        // Double cactus
        const h = 30 + Math.random() * 10;
        ob = { type: "cactus", x: W + 10, y: H - 34 - h, w: 28, h: h + 4, variant: "double" };
    } else {
        // Pterodactyl (only after score > 300)
        if (score < 300) return spawnObstacle();
        const flyY = Math.random() < 0.5 ? H - 70 : H - 45;
        ob = { type: "bird", x: W + 10, y: flyY, w: 36, h: 24, wingFrame: 0, wingTimer: 0 };
    }

    obstacles.push(ob);
}

/* =============================================
   INPUT
   ============================================= */
const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.code] = true;

    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        if (!gameRunning && !gameOver) startGame();
        else if (gameOver) resetGame();
        else jump();
    }
    if (e.code === "ArrowDown") {
        e.preventDefault();
        if (gameRunning) duck(true);
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.code] = false;
    if (e.code === "ArrowDown") duck(false);
});

// Touch / click
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    handleTap(e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener("mousedown", (e) => {
    handleTap(e.clientY);
});

function handleTap(tapY) {
    const rect = canvas.getBoundingClientRect();
    const relY = (tapY - rect.top) / rect.height;

    if (!gameRunning && !gameOver) { startGame(); return; }
    if (gameOver) { resetGame(); return; }

    // Tap bottom third = duck, otherwise jump
    if (relY > 0.65) {
        duck(true);
        setTimeout(() => duck(false), 400);
    } else {
        jump();
    }
}

/* =============================================
   DINO ACTIONS
   ============================================= */
const GRAVITY = 0.6;
const JUMP_FORCE = -11.5;

function jump() {
    if (dino.jumping) return;
    dino.vy = JUMP_FORCE;
    dino.jumping = true;
    dino.ducking = false;
}

function duck(active) {
    if (!dino.jumping) {
        dino.ducking = active;
    }
}

/* =============================================
   COLLISION
   ============================================= */
function checkCollision() {
    const dh = dino.ducking ? dino.duckH : dino.h;
    const dy = dino.ducking ? (H - 34 - dino.duckH) : dino.y;
    const pad = 6;

    for (const ob of obstacles) {
        if (
            dino.x + pad < ob.x + ob.w - pad &&
            dino.x + dino.w - pad > ob.x + pad &&
            dy + pad < ob.y + ob.h - pad &&
            dy + dh - pad > ob.y + pad
        ) {
            return true;
        }
    }
    return false;
}

/* =============================================
   UPDATE
   ============================================= */
function startGame() {
    gameRunning = true;
}

function update() {
    if (!gameRunning || gameOver) return;

    frameCount++;

    // Speed increases over time
    speed = 6 + Math.floor(score / 100) * 0.5;
    if (speed > 16) speed = 16;

    // Score
    if (frameCount % 6 === 0) {
        score++;
        document.getElementById("scoreDisplay").textContent = String(score).padStart(5, "0");
        if (score > hiScore) {
            hiScore = score;
            localStorage.setItem("dinoHi", hiScore);
            document.getElementById("hiDisplay").textContent = "HI " + String(hiScore).padStart(5, "0");
        }
    }

    // Flash at milestones
    if (score > 0 && score % 100 === 0 && frameCount % 6 === 0) {
        flashTimer = 20;
    }
    if (flashTimer > 0) flashTimer--;

    // Dino physics
    if (dino.jumping) {
        dino.vy += GRAVITY;
        dino.y += dino.vy;
        if (dino.y >= H - 44) {
            dino.y = H - 44;
            dino.vy = 0;
            dino.jumping = false;
        }
    }

    // Dino leg animation
    dino.legTimer++;
    if (dino.legTimer > (dino.ducking ? 4 : 6)) {
        dino.legTimer = 0;
        dino.legFrame = (dino.legFrame + 1) % 2;
    }

    // Ground scroll
    groundOffset = (groundOffset + speed) % 800;

    // Clouds
    clouds.forEach(c => c.x -= c.speed);
    clouds = clouds.filter(c => c.x + c.w > -20);
    if (Math.random() < 0.008) clouds.push(makeCloud());

    // Obstacle spawning
    spawnTimer++;
    const minGap = Math.max(40, 80 - Math.floor(score / 50) * 2);
    if (spawnTimer > minGap + Math.random() * 40) {
        spawnObstacle();
        spawnTimer = 0;
    }

    // Move obstacles
    obstacles.forEach(ob => {
        ob.x -= speed;
        if (ob.type === "bird") {
            ob.wingTimer++;
            if (ob.wingTimer > 10) {
                ob.wingTimer = 0;
                ob.wingFrame = (ob.wingFrame + 1) % 2;
            }
        }
    });
    obstacles = obstacles.filter(ob => ob.x + ob.w > -30);

    // Collision
    if (checkCollision()) {
        gameOver = true;
        gameRunning = false;
    }
}

/* =============================================
   DRAW
   ============================================= */
function draw() {
    const c = getCSS;

    // Background
    ctx.fillStyle = getCSS("--bg");
    ctx.fillRect(0, 0, W, H);

    const dinoColor = getCSS("--dino");
    const obColor = getCSS("--obstacle");
    const groundColor = getCSS("--ground");
    const cloudColor = getCSS("--cloud");
    const scoreColor = getCSS("--score-color");

    // Clouds
    ctx.fillStyle = cloudColor;
    clouds.forEach(c => {
        const r = c.w * 0.22;
        ctx.beginPath();
        ctx.arc(c.x + r, c.y, r, 0, Math.PI * 2);
        ctx.arc(c.x + c.w * 0.5, c.y - r * 0.5, r * 1.2, 0, Math.PI * 2);
        ctx.arc(c.x + c.w - r, c.y, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
    });

    // Ground line
    const groundY = H - 34;
    ctx.strokeStyle = groundColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    // Ground bumps
    ctx.fillStyle = groundColor;
    groundBumps.forEach(b => {
        const bx = ((b.x - groundOffset) % 800 + 800) % 800;
        if (bx > -20 && bx < W + 20) {
            ctx.fillRect(bx, groundY + 4, b.w, b.h);
        }
    });

    // Obstacles
    obstacles.forEach(ob => {
        ctx.fillStyle = obColor;
        if (ob.type === "cactus") {
            drawCactus(ob);
        } else {
            drawBird(ob, obColor);
        }
    });

    // Dino
    drawDino(dinoColor);

    // Flash effect on score milestone
    if (flashTimer > 0 && flashTimer % 4 < 2) {
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(0, 0, W, H);
    }

    // Start screen
    if (!gameRunning && !gameOver) {
        ctx.fillStyle = getCSS("--text");
        ctx.font = "bold 20px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Press Space to Start", W / 2, H / 2 - 10);
        ctx.font = "13px 'Segoe UI', sans-serif";
        ctx.fillStyle = getCSS("--text-faint");
        ctx.fillText("or tap the screen", W / 2, H / 2 + 14);
        ctx.textAlign = "left";
    }

    // Game over
    if (gameOver) {
        ctx.fillStyle = getCSS("--overlay-bg");
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = getCSS("--text");
        ctx.font = "bold 28px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("G A M E  O V E R", W / 2, H / 2 - 18);

        ctx.font = "15px 'Segoe UI', sans-serif";
        ctx.fillStyle = getCSS("--text-muted");
        ctx.fillText("Score: " + score + "   Best: " + hiScore, W / 2, H / 2 + 12);

        ctx.font = "13px 'Segoe UI', sans-serif";
        ctx.fillStyle = getCSS("--text-faint");
        ctx.fillText("Press Space or tap to restart", W / 2, H / 2 + 38);
        ctx.textAlign = "left";
    }
}

function drawCactus(ob) {
    const { x, y, w, h, variant } = ob;
    ctx.fillStyle = getCSS("--obstacle");

    if (variant === "double") {
        // Two cacti side by side
        drawSingleCactus(x, y, 12, h - 4);
        drawSingleCactus(x + 16, y + 6, 12, h - 10);
        return;
    }
    drawSingleCactus(x, y, w, h - 4);
}

function drawSingleCactus(x, y, w, h) {
    const r = Math.max(1, w * 0.3);
    // Main trunk
    roundRect(x, y, w, h, r);
    // Left arm
    if (h > 20) {
        ctx.fillRect(x - 5, y + h * 0.3, 6, 3);
        roundRect(x - 7, y + h * 0.15, 5, h * 0.2, 2);
    }
    // Right arm
    if (h > 28) {
        ctx.fillRect(x + w - 1, y + h * 0.45, 6, 3);
        roundRect(x + w + 2, y + h * 0.3, 5, h * 0.2, 2);
    }
}

function drawBird(ob, color) {
    const { x, y, w, wingFrame } = ob;
    ctx.fillStyle = color;

    // Body
    ctx.beginPath();
    ctx.ellipse(x + w * 0.5, y + 12, w * 0.45, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.beginPath();
    ctx.moveTo(x + w - 2, y + 10);
    ctx.lineTo(x + w + 8, y + 12);
    ctx.lineTo(x + w - 2, y + 14);
    ctx.fill();

    // Wings
    ctx.beginPath();
    if (wingFrame === 0) {
        ctx.moveTo(x + 8, y + 8);
        ctx.lineTo(x + 20, y - 6);
        ctx.lineTo(x + 28, y + 8);
    } else {
        ctx.moveTo(x + 8, y + 16);
        ctx.lineTo(x + 20, y + 26);
        ctx.lineTo(x + 28, y + 16);
    }
    ctx.fill();

    // Eye
    ctx.fillStyle = getCSS("--bg");
    ctx.beginPath();
    ctx.arc(x + w * 0.7, y + 10, 2, 0, Math.PI * 2);
    ctx.fill();
}

function drawDino(color) {
    const ducking = dino.ducking;
    const dh = ducking ? dino.duckH : dino.h;
    const dx = dino.x;
    const dy = ducking ? (H - 34 - dino.duckH) : dino.y;
    const legF = dino.legFrame;

    ctx.fillStyle = color;

    if (ducking) {
        // Long body
        roundRect(dx, dy, 52, dh, 6);
        // Head bump
        roundRect(dx + 38, dy - 6, 18, 14, 5);
        // Eye
        ctx.fillStyle = getCSS("--bg");
        ctx.beginPath();
        ctx.arc(dx + 50, dy - 1, 2.5, 0, Math.PI * 2);
        ctx.fill();
        // Legs
        ctx.fillStyle = color;
        if (legF === 0) {
            ctx.fillRect(dx + 8, dy + dh, 4, 6);
            ctx.fillRect(dx + 20, dy + dh, 4, 3);
        } else {
            ctx.fillRect(dx + 8, dy + dh, 4, 3);
            ctx.fillRect(dx + 20, dy + dh, 4, 6);
        }
    } else {
        // Body
        roundRect(dx + 6, dy + 10, 30, 28, 6);
        // Head
        roundRect(dx + 14, dy - 6, 26, 22, 7);
        // Jaw
        roundRect(dx + 22, dy + 8, 20, 6, 3);
        // Eye
        ctx.fillStyle = getCSS("--bg");
        ctx.beginPath();
        ctx.arc(dx + 32, dy + 2, 3, 0, Math.PI * 2);
        ctx.fill();
        // Pupil
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(dx + 33, dy + 2, 1.2, 0, Math.PI * 2);
        ctx.fill();
        // Tail
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(dx + 6, dy + 16);
        ctx.lineTo(dx - 4, dy + 10);
        ctx.lineTo(dx + 6, dy + 24);
        ctx.fill();
        // Arms
        ctx.fillRect(dx + 30, dy + 22, 3, 8);
        ctx.fillRect(dx + 30, dy + 28, 6, 3);
        // Legs
        if (!dino.jumping) {
            if (legF === 0) {
                ctx.fillRect(dx + 12, dy + 38, 5, 8);
                ctx.fillRect(dx + 24, dy + 38, 5, 4);
            } else {
                ctx.fillRect(dx + 12, dy + 38, 5, 4);
                ctx.fillRect(dx + 24, dy + 38, 5, 8);
            }
        } else {
            // Tucked legs in air
            ctx.fillRect(dx + 12, dy + 38, 5, 4);
            ctx.fillRect(dx + 24, dy + 38, 5, 4);
        }
    }
}

function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    r = Math.max(0, r);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
}

/* =============================================
   GAME LOOP
   ============================================= */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
